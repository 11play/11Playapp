name: Build 11Play APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed 11Play APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # JAVA 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # ANDROID SDK
      # =====================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"


      # =====================================================
      # GRADLE
      #
      # Android Gradle Plugin 8.13.2
      # requires Gradle 8.13 and JDK 17.
      # =====================================================

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"


      # =====================================================
      # VALIDATE PROJECT
      # =====================================================

      - name: Validate Android project
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/google-services.json

          echo "Android project files found."
          echo "google-services.json found."


      # =====================================================
      # RESTORE PERMANENT SIGNING KEY
      #
      # Required GitHub Secrets:
      #
      # SIGNING_KEYSTORE_B64
      # SIGNING_KEY_PASSWORD
      #
      # Alias:
      # 11play
      # =====================================================

      - name: Restore 11Play signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "ERROR: SIGNING_KEYSTORE_B64 secret is missing."
            exit 1
          fi

          if [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "ERROR: SIGNING_KEY_PASSWORD secret is missing."
            exit 1
          fi

          mkdir -p signing

          printf '%s' "$SIGNING_KEYSTORE_B64" \
            | base64 --decode \
            > signing/11play-release.jks

          if [ ! -s signing/11play-release.jks ]; then
            echo "ERROR: Signing keystore could not be restored."
            exit 1
          fi

          keytool \
            -list \
            -keystore signing/11play-release.jks \
            -storepass "$SIGNING_KEY_PASSWORD" \
            -alias 11play \
            >/dev/null

          echo "Permanent signing keystore verified."


      # =====================================================
      # SHOW GRADLE VERSION
      # =====================================================

      - name: Show Gradle version
        run: gradle --version


      # =====================================================
      # BUILD UNSIGNED RELEASE APK
      # =====================================================

      - name: Build release APK
        run: gradle clean assembleRelease --stacktrace


      # =====================================================
      # LOCATE UNSIGNED APK
      # =====================================================

      - name: Locate release APK
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "UNSIGNED_APK=$APK_PATH" >> "$GITHUB_ENV"

          echo "Release APK found:"
          ls -lh "$APK_PATH"


      # =====================================================
      # ZIPALIGN
      # =====================================================

      - name: Align release APK
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          mkdir -p apk-output

          "$BUILD_TOOLS/zipalign" \
            -f \
            -v \
            4 \
            "$UNSIGNED_APK" \
            apk-output/11Play-aligned.apk


      # =====================================================
      # SIGN APK
      # =====================================================

      - name: Sign 11Play APK
        shell: bash
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/11play-release.jks \
            --ks-key-alias 11play \
            --ks-pass env:SIGNING_KEY_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out apk-output/11Play.apk \
            apk-output/11Play-aligned.apk


      # =====================================================
      # VERIFY APK SIGNATURE
      # =====================================================

      - name: Verify signed APK
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            apk-output/11Play.apk

          if [ ! -s apk-output/11Play.apk ]; then
            echo "ERROR: Signed APK does not exist."
            exit 1
          fi

          echo "========================================"
          echo "11Play APK successfully built and signed."
          echo "========================================"

          ls -lh apk-output/11Play.apk


      # =====================================================
      # REMOVE TEMPORARY SENSITIVE FILES
      # =====================================================

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -rf signing
          rm -f apk-output/11Play-aligned.apk


      # =====================================================
      # UPLOAD FINAL APK
      # =====================================================

      - name: Upload 11Play APK
        uses: actions/upload-artifact@v4
        with:
          name: 11Play-APK
          path: apk-output/11Play.apk
          if-no-files-found: error
          retention-days: 30
